<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CHROMATIC RESENHA</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
html,body { width:100%; height:100%; overflow:hidden; background:#111; font-family: monospace; }
#gameCanvas { display:block; margin:0 auto; background:#222; max-width:100%; max-height:100%; }
#ui { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
.menu { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; pointer-events:auto; }
.menu h1 { font-size:clamp(28px,9vw,72px); color:#ff0; text-shadow:5px 5px 0 #f00, -2px -2px 0 #0ff; margin-bottom:24px; letter-spacing:6px; animation:pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
.menu h2 { font-size:clamp(18px,4vw,32px); margin:12px; color:#0ff; text-shadow:2px 2px 0 #00a; }
.btn { background:linear-gradient(180deg,#444,#222); border:3px solid #fff; color:#fff; padding:14px 32px; margin:10px; font-size:clamp(14px,3vw,20px); cursor:pointer; font-family:monospace; text-transform:uppercase; letter-spacing:2px; box-shadow:4px 4px 0 #000; transition:all 0.1s; }
.btn:hover, .btn:active { background:linear-gradient(180deg,#666,#333); border-color:#ff0; color:#ff0; transform:translate(-2px,-2px); box-shadow:6px 6px 0 #000; }
.char-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:90vw; }
.char-btn { width:clamp(72px,18vw,130px); height:clamp(72px,18vw,130px); border:3px solid #fff; background:#1a1a2e; color:#fff; font-size:11px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:6px; transition:all 0.15s; }
.char-btn:hover { border-color:#0ff; transform:scale(1.05); }
.char-btn.selected { border-color:#ff0; background:#3d2b00; box-shadow:0 0 16px #ff0; }
.char-btn .icon { width:44px; height:44px; margin-bottom:6px; border-radius:8px; }
#hud { position:absolute; top:0; left:0; width:100%; height:70px; display:none; pointer-events:none; }
.bar-bg { position:absolute; top:12px; height:28px; background:#111; border:3px solid #fff; box-shadow:0 0 8px rgba(0,0,0,0.5); }
.bar-fill { height:100%; transition:width 0.08s; }
#p1bar { left:12px; width:36%; }
#p2bar { right:12px; width:36%; }
#p1fill { background:linear-gradient(90deg,#0f0,#2ecc71); width:100%; }
#p2fill { background:linear-gradient(90deg,#e74c3c,#c0392b); width:100%; float:right; }
#timer { position:absolute; left:50%; transform:translateX(-50%); top:8px; font-size:32px; color:#ff0; font-weight:bold; text-shadow:3px 3px 0 #f00; background:rgba(0,0,0,0.5); padding:2px 16px; border:2px solid #fff; }
#touchControls { position:absolute; bottom:0; left:0; width:100%; height:150px; display:none; pointer-events:auto; }
.tc-btn { position:absolute; width:64px; height:64px; background:rgba(255,255,255,0.2); border:3px solid #fff; border-radius:50%; color:#fff; font-size:16px; font-weight:bold; display:flex; align-items:center; justify-content:center; user-select:none; box-shadow:0 0 10px rgba(255,255,255,0.3); }
.tc-btn:active { background:rgba(255,255,0,0.4); border-color:#ff0; }
#btnLeft { left:20px; bottom:40px; }
#btnRight { left:100px; bottom:40px; }
#btnJump { left:60px; bottom:110px; }
#btnAtk { right:150px; bottom:40px; }
#btnStrong { right:75px; bottom:40px; }
#btnSpecial { right:20px; bottom:110px; }
#btnBlock { right:95px; bottom:110px; }
.hidden { display:none !important; }
#victoryScreen { background:rgba(0,0,0,0.9); }
#victoryScreen .big { font-size:clamp(36px,11vw,80px); color:#ffd700; text-shadow:0 0 30px #ff0, 4px 4px 0 #f00; margin:24px; animation:pulse 0.8s ease-in-out infinite; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="titleScreen" class="menu">
    <h1>CHROMATIC<br>RESENHA</h1>
    <button class="btn" id="btnStart">START</button>
  </div>
  <div id="mainMenu" class="menu hidden">
    <h1>CHROMATIC RESENHA</h1>
    <button class="btn" id="btnStory">STORY MODE</button>
    <button class="btn" id="btnVersus">VERSUS MODE</button>
    <button class="btn" id="btnConfig">CONFIG</button>
  </div>
  <div id="charSelect" class="menu hidden">
    <h2 id="charSelectTitle">SELECT CHARACTER</h2>
    <div class="char-grid" id="charGrid"></div>
    <button class="btn hidden" id="btnConfirmChar">CONFIRM</button>
  </div>
  <div id="stageSelect" class="menu hidden">
    <h2>SELECT STAGE</h2>
    <button class="btn stage-btn" data-stage="0">ARENA</button>
    <button class="btn stage-btn" data-stage="1">ROOFTOP</button>
    <button class="btn stage-btn" data-stage="2">DOJO</button>
    <button class="btn" id="btnBackStage">BACK</button>
  </div>
  <div id="configMenu" class="menu hidden">
    <h2>CONFIG</h2>
    <p style="margin:10px;color:#aaa">PC Controls:</p>
    <p style="font-size:12px;color:#ccc">P1: WASD move, F attack, G strong, H special, S block</p>
    <p style="font-size:12px;color:#ccc">P2: Arrows move, 1 attack, 2 strong, 3 special, Down block</p>
    <button class="btn" id="btnBackConfig">BACK</button>
  </div>
  <div id="hud">
    <div class="bar-bg" id="p1bar"><div class="bar-fill" id="p1fill"></div></div>
    <div id="timer">99</div>
    <div class="bar-bg" id="p2bar"><div class="bar-fill" id="p2fill"></div></div>
  </div>
  <div id="victoryScreen" class="menu hidden">
    <div class="big">CONGRATULATIONS!</div>
    <div id="vicChar" style="width:120px;height:120px;margin:20px;border:4px solid #ffd700;"></div>
    <div id="vicName" style="font-size:24px;color:#fff;margin:10px;"></div>
    <button class="btn" id="btnVicContinue">CONTINUE</button>
  </div>
  <div id="defeatScreen" class="menu hidden">
    <h1 style="color:#f00">DEFEAT</h1>
    <button class="btn" id="btnDefRetry">RETRY</button>
    <button class="btn" id="btnDefMenu">MAIN MENU</button>
  </div>
  <div id="touchControls">
    <div class="tc-btn" id="btnLeft">◀</div>
    <div class="tc-btn" id="btnRight">▶</div>
    <div class="tc-btn" id="btnJump">▲</div>
    <div class="tc-btn" id="btnAtk">A</div>
    <div class="tc-btn" id="btnStrong">S</div>
    <div class="tc-btn" id="btnSpecial">SP</div>
    <div class="tc-btn" id="btnBlock">B</div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
